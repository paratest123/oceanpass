<title>Ocean Pass · Ticket Credit Verification</title>
<style>
    :root {
        --bg: #f4ece1;
        --panel: #fffaf3;
        --panel-2: #f7efe3;
        --ink: #33291f;
        --ink-2: #7a6a58;
        --line: #e6d8c6;
        --line-2: #efe6d8;
        --accent: #d1825a;
        --accent-ink: #b56841;
        --accent-2: #e0a06f;
        --profit: #6f9e79;
        --warn: #c67c17;
        --warn-bg: #faedd6;
        --danger: #c0453f;
        --shadow: 0 1px 2px rgba(15, 35, 33, .05), 0 6px 22px rgba(15, 35, 33, .07);
        --radius: 14px;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #181310;
            --panel: #241c16;
            --panel-2: #2c231b;
            --ink: #f0e6da;
            --ink-2: #b09a86;
            --line: #382c22;
            --line-2: #2a2118;
            --accent: #e0a077;
            --accent-ink: #eeb98f;
            --accent-2: #e0a06f;
            --profit: #8bbf90;
            --warn: #e2a251;
            --warn-bg: #2a2015;
            --danger: #e06b64;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .32);
        }
    }

    :root[data-theme="light"] {
        --bg: #f4ece1;
        --panel: #fffaf3;
        --panel-2: #f7efe3;
        --ink: #33291f;
        --ink-2: #7a6a58;
        --line: #e6d8c6;
        --line-2: #efe6d8;
        --accent: #d1825a;
        --accent-ink: #b56841;
        --accent-2: #e0a06f;
        --profit: #6f9e79;
        --warn: #c67c17;
        --warn-bg: #faedd6;
        --danger: #c0453f;
    }

    :root[data-theme="dark"] {
        --bg: #181310;
        --panel: #241c16;
        --panel-2: #2c231b;
        --ink: #f0e6da;
        --ink-2: #b09a86;
        --line: #382c22;
        --line-2: #2a2118;
        --accent: #e0a077;
        --accent-ink: #eeb98f;
        --accent-2: #e0a06f;
        --profit: #8bbf90;
        --warn: #e2a251;
        --warn-bg: #2a2015;
        --danger: #e06b64;
    }

    * {
        box-sizing: border-box
    }

    body {
        margin: 0;
        background: radial-gradient(130% 55% at 50% -5%, rgba(224, 160, 111, .22), transparent 60%), var(--bg);
        background-attachment: fixed;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        line-height: 1.55
    }

    .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px 18px 60px
    }

    .tnum {
        font-variant-numeric: tabular-nums
    }

    .langbar {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-bottom: 12px;
        flex-wrap: wrap
    }

    .langbar button {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink-2);
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 12.5px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit
    }

    .langbar button.on {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent)
    }

    .hero {
        background: linear-gradient(160deg, #c7cdd0 0%, #eac7ab 34%, #e6a982 58%, #d1825a 100%);
        border-radius: 18px;
        padding: 22px;
        color: #fff;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
        text-shadow: 0 1px 8px rgba(120, 55, 25, .30)
    }

    .hero.photo::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(38, 24, 16, .82) 0%, rgba(70, 42, 28, .30) 46%, rgba(120, 70, 45, .12) 100%);
        z-index: 0
    }

    .hero > * {
        position: relative;
        z-index: 1
    }

    .hero .wave {
        font-size: 12px;
        letter-spacing: .22em;
        text-transform: uppercase;
        opacity: .9;
        font-weight: 700
    }

    .hero h1 {
        margin: 6px 0 6px;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -.01em
    }

    .hero p {
        margin: 0;
        font-size: 13px;
        opacity: .95
    }

    .hero .badge {
        display: inline-block;
        margin-top: 11px;
        background: rgba(255, 255, 255, .2);
        border: 1px solid rgba(255, 255, 255, .35);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 12px;
        font-weight: 700
    }

    .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-top: 16px;
        overflow: hidden
    }

    .card h2 {
        font-size: 14px;
        margin: 0;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-weight: 800
    }

    .card h2 .sub {
        color: var(--ink-2);
        font-weight: 500;
        font-size: 12px;
        margin-left: 4px
    }

    .card .body {
        padding: 14px 16px
    }

    label.f {
        display: block;
        font-size: 12.5px;
        font-weight: 700;
        margin: 0 0 5px
    }

    input, select {
        width: 100%;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-2);
        color: var(--ink);
        font-size: 14px;
        font-family: inherit
    }

    input:focus, select:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
        border-color: var(--accent)
    }

    .emailwarn {
        margin-top: 8px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        border-radius: 9px;
        padding: 9px 11px;
        line-height: 1.42;
        box-shadow: var(--shadow)
    }

    .row {
        display: grid;
        gap: 10px
    }

    .row.g2 {
        grid-template-columns:1fr 1fr
    }

    .row.g3 {
        grid-template-columns:1fr 1.1fr .9fr
    }

    .mb {
        margin-bottom: 12px
    }

    .tk {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px;
        margin-bottom: 12px;
        background: var(--panel-2)
    }

    .tk .thead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px
    }

    .tk .tnum2 {
        font-weight: 800;
        font-size: 13px;
        color: var(--accent-ink)
    }

    .del {
        background: none;
        border: 1px solid var(--line);
        color: var(--danger);
        border-radius: 8px;
        padding: 4px 9px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer
    }

    .up {
        display: grid;
        grid-template-columns:1fr 1fr;
        gap: 10px;
        margin-top: 10px
    }

    .drop {
        border: 1.5px dashed var(--line);
        border-radius: 10px;
        padding: 10px;
        text-align: center;
        cursor: pointer;
        background: var(--panel)
    }

    .drop:hover {
        border-color: var(--accent)
    }

    .drop .ic {
        font-size: 20px
    }

    .drop .t {
        font-size: 11.5px;
        font-weight: 700;
        margin-top: 2px
    }

    .drop.has {
        border-style: solid;
        border-color: var(--profit);
        padding: 6px
    }

    .drop img {
        max-width: 100%;
        max-height: 76px;
        border-radius: 6px;
        display: block;
        margin: 0 auto
    }

    .drop input {
        display: none
    }

    .addbtn {
        width: 100%;
        padding: 12px;
        border: 1.5px dashed var(--accent);
        background: transparent;
        color: var(--accent-ink);
        border-radius: 11px;
        font-weight: 800;
        font-size: 13.5px;
        cursor: pointer
    }

    .sum {
        background: linear-gradient(135deg, rgba(14, 154, 151, .09), rgba(18, 179, 175, .06));
        border: 1px solid var(--accent);
        border-radius: 12px;
        padding: 14px 16px
    }

    .sum .lab {
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-2);
        text-transform: uppercase;
        letter-spacing: .05em
    }

    .sum .big {
        font-size: 26px;
        font-weight: 800;
        color: var(--accent-ink);
        margin: 4px 0 2px
    }

    .sum .note {
        font-size: 11.5px;
        color: var(--ink-2)
    }

    .sum .items {
        margin-top: 10px;
        border-top: 1px dashed var(--line);
        padding-top: 8px;
        font-size: 12.5px
    }

    .sum .items div {
        display: flex;
        justify-content: space-between;
        padding: 2px 0
    }

    .consent {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        padding: 8px 0;
        font-size: 12.5px;
        cursor: pointer
    }

    .consent input {
        width: 18px;
        height: 18px;
        margin-top: 1px;
        flex-shrink: 0;
        accent-color: var(--accent)
    }

    .privbox {
        border: 1px solid var(--accent);
        background: var(--panel-2);
        border-radius: 11px;
        padding: 12px 13px;
        margin-bottom: 12px
    }

    .privt {
        font-size: 12.5px;
        font-weight: 800;
        color: var(--accent-ink);
        margin-bottom: 8px
    }

    .privrow {
        font-size: 11.5px;
        color: var(--ink-2);
        line-height: 1.5;
        margin-bottom: 4px
    }

    .privrow b {
        color: var(--ink);
        font-weight: 700
    }

    .submit {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        margin-top: 4px;
        box-shadow: var(--shadow)
    }

    .submit:hover {
        background: var(--accent-ink)
    }

    .err {
        color: var(--danger);
        font-size: 12.5px;
        margin-top: 8px;
        font-weight: 600;
        display: none
    }

    .foot {
        font-size: 11px;
        color: var(--ink-2);
        text-align: center;
        margin-top: 18px;
        line-height: 1.6
    }

    .warn {
        background: var(--warn-bg);
        border: 1px solid var(--warn);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12px;
        color: var(--warn);
        margin-top: 12px
    }

    #done {
        display: none;
        text-align: center
    }

    #done .chk {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--profit);
        color: #fff;
        font-size: 34px;
        line-height: 64px;
        margin: 6px auto 12px
    }

    #done h2 {
        font-size: 20px;
        margin: 0 0 6px;
        border: none;
        padding: 0
    }

    #done .rc {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        text-align: left;
        margin: 14px 0;
        font-size: 13px
    }

    #done .rc .r {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        border-bottom: 1px solid var(--line-2)
    }

    #done .rc .r:last-child {
        border: none
    }

    .proto {
        position: fixed;
        top: 8px;
        left: 8px;
        background: var(--warn);
        color: #fff;
        font-size: 10.5px;
        font-weight: 800;
        padding: 3px 9px;
        border-radius: 999px;
        z-index: 9
    }
</style>

            });
            applyLang();
            calc();
            return
        }
        e.remove();
        renumber();
        calc()
    }

    function renumber() {
        document.querySelectorAll(".tk").forEach((tk, i) => tk.querySelector(".cnt").textContent = "#" + (i + 1))
    }

    function prev(inp, did) {
        const d = document.getElementById(did);
        const f = inp.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = e => {
            d.classList.add("has");
            d.innerHTML = `<img src="${e.target.result}"><div class="t" style="color:var(--profit);margin-top:3px">${t("attached")}</div>`;
            d.appendChild(inp);
            inp.style.display = "none"
        };
        r.readAsDataURL(f)
    }

    function calc() {
        const tot = {}, items = [];
        document.querySelectorAll(".tk").forEach(tk => {
            const a = parseFloat(tk.querySelector(".amt").value) || 0;
            const c = tk.querySelector(".cur").value;
            const ci = CITIES[LANG][tk.querySelector(".city").selectedIndex];
            const ti = TIERS[tk.querySelector(".tier").selectedIndex];
            if (a > 0) {
                tot[c] = (tot[c] || 0) + a;
                items.push(`<div><span>${ci} · ${ti}</span><span class="tnum">${sym(c)}${a.toLocaleString()}</span></div>`)
            }
        });
        const keys = Object.keys(tot);
        document.getElementById("creditTotal").innerHTML = keys.length ? keys.map(k => sym(k) + tot[k].toLocaleString()).join(" + ") : "—";
        document.getElementById("itemList").innerHTML = items.join("")
    }

    function applyLang() {
        document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
        document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
        document.querySelectorAll(".city").forEach(s => {
            const i = s.selectedIndex < 0 ? 0 : s.selectedIndex;
            s.innerHTML = CITIES[LANG].map(c => `<option>${c}</option>`).join("");
            s.selectedIndex = i
        });
        document.querySelectorAll("#langbar button").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
        document.documentElement.lang = LANG
    }

    function setLang(l) {
        LANG = l;
        applyLang();
        calc()
    }

    function showErr(k) {
        const e = document.getElementById("err");
        e.textContent = "⚠ " + t(k);
        e.style.display = "block";
        e.scrollIntoView({behavior: "smooth", block: "center"})
    }

    function val(id) {
        return document.getElementById(id).value.trim()
    }

    function submitForm() {
        if (!val("bstage") || !val("name") || !val("email")) return showErr("errName");
        const tks = [...document.querySelectorAll(".tk")];
        let valid = [];
        for (const tk of tks) {
            const a = parseFloat(tk.querySelector(".amt").value) || 0;
            if (a <= 0) continue;
            const hasT = document.getElementById("d_t" + tk.dataset.id).classList.contains("has");
            const hasP = document.getElementById("d_p" + tk.dataset.id).classList.contains("has");
            if (!hasT || !hasP) return showErr("errPhoto");
            valid.push({
                city: CITIES.en[tk.querySelector(".city").selectedIndex],
                tier: TIERS[tk.querySelector(".tier").selectedIndex],
                qty: tk.querySelector(".qty").value,
                amt: a,
                cur: tk.querySelector(".cur").value,
                ticketPhoto: (document.querySelector("#d_t" + tk.dataset.id + " img") || {}).src || "",
                payPhoto: (document.querySelector("#d_p" + tk.dataset.id + " img") || {}).src || ""
            })
        }
        if (!valid.length) return showErr("errTicket");
        if (![...document.querySelectorAll(".cs")].every(c => c.checked)) return showErr("errConsent");
        document.getElementById("err").style.display = "none";
        const tot = {};
        valid.forEach(v => tot[v.cur] = (tot[v.cur] || 0) + v.amt);
        const credit = Object.keys(tot).map(k => sym(k) + tot[k].toLocaleString()).join(" + ");
        const rid = "OP-2026-" + (1000 + (val("name").length * 7 + val("email").length * 13) % 9000);
        let rows = `<div class="r" style="font-weight:700;color:var(--accent-ink)"><span>${t("rBstage")}</span><b>${val("bstage")}</b></div><div class="r"><span>${t("rApplicant")}</span><b>${val("name")}</b></div><div class="r"><span>${t("rEmail")}</span><span>${val("email")}</span></div><div class="r"><span>${t("rTickets")}</span><span>${valid.length}</span></div>`;
        valid.forEach(v => rows += `<div class="r"><span>${v.city} · ${v.tier} ×${v.qty}</span><span class="tnum">${sym(v.cur)}${v.amt.toLocaleString()}</span></div>`);
        rows += `<div class="r" style="font-weight:800;color:var(--accent-ink)"><span>${t("rCredit")}</span><span>${credit}</span></div><div class="r"><span>${t("rRef")}</span><b>${rid}</b></div>`;
        document.getElementById("receipt").innerHTML = rows;
        if (ENDPOINT && ENDPOINT.indexOf("PASTE") < 0) {
            try {
                fetch(ENDPOINT, {
                    method: "POST",
                    mode: "no-cors",
                    keepalive: true,
                    body: JSON.stringify({
                        ref: rid,
                        lang: LANG,
                        account: val("bstage"),
                        name: val("name"),
                        email: val("email"),
                        phone: val("phone"),
                        tickets: valid
                    })
                }).catch(function () {
                })
            } catch (e) {
            }
        }
        document.getElementById("form").style.display = "none";
        document.getElementById("done").style.display = "block";
        window.scrollTo(0, 0)
    }

    function reset_() {
        document.querySelectorAll("#form input").forEach(i => {
            if (i.type !== 'file') i.value = ''
        });
        document.getElementById("tickets").innerHTML = "";
        idc = 0;
        document.querySelectorAll(".cs").forEach(c => c.checked = false);
        document.getElementById("done").style.display = "none";
        document.getElementById("form").style.display = "block";
        addTicket();
        window.scrollTo(0, 0)
    }

    addTicket();
    applyLang();
</script>
